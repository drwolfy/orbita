server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # Cabeceras de seguridad por defecto (perfil ★). Se re-incluye en cada
    # `location` que ponga su propio `add_header`, o nginx las descartaría ahí.
    include /etc/nginx/seguridad.conf;

    # Aplicación de una sola página: cualquier ruta cae en index.html.
    location / {
        include /etc/nginx/seguridad.conf;
        try_files $uri $uri/ /index.html;
    }

    # El fallo clásico de las PWA (§8): si el navegador cachea el service
    # worker, se queda con una versión vieja para siempre y no hay forma de
    # actualizar. Estos tres archivos NUNCA se cachean.
    location = /sw.js {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location = /registerSW.js {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /index.html {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.webmanifest {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Lo de /assets/ lleva hash en el nombre: se puede cachear para siempre.
    location /assets/ {
        include /etc/nginx/seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
