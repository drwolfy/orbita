# Cabeceras de seguridad (perfil ★: app expuesta a internet).
#
# Van en un include porque en nginx los `add_header` del server se PIERDEN en
# cualquier `location` que declare su propio `add_header` (y aquí varios ponen
# Cache-Control). Incluyendo este fichero en cada uno, las cabeceras llegan
# siempre. `always` = también en respuestas de error.
#
# CSP a la medida de una PWA estática sin backend:
#  - script-src 'self': el bundle lleva hash, no hay ni un script inline.
#  - style-src 'unsafe-inline': React pinta estilos como atributo `style`.
#  - img-src data:: el lienzo del Relevo viaja como data:image/png en <img>.
#  - connect-src 'self': no hay llamadas de red; todo viaja en el bundle.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
